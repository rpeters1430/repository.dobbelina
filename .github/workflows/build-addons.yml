name: Build Kodi Add-on Packages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
          cache: 'pip'
          cache-dependency-path: requirements-test.txt

      - name: Auto-bump changed add-on versions
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        id: bump_versions
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python scripts/auto_bump_versions.py

      - name: Update Changelog
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          python scripts/update_changelog.py

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Build add-on archives
        run: |
          # Remove --addons filter to build everything found in the repo
          python build_repo_addons.py --out build/addons --update-index

      - name: Validate archives against repository index
        run: python scripts/validate_addon_packages.py build/addons addons.xml

      - name: Commit version bumps, changelog, and index
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "*/addon.xml" "*/changelog.txt" addons.xml addons.xml.md5
          if git diff --cached --quiet; then
            echo "No version bump or index changes to commit."
            exit 0
          fi
          git commit -m "chore: auto-bump addon versions and update index [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Collect build artifacts
        run: |
          mkdir -p upload
          cp addons.xml addons.xml.md5 upload/
          cp -r build/addons/* upload/

      - name: Upload packages artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kodi-addons
          path: upload
          if-no-files-found: error
          retention-days: 3

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: upload
          branch: gh-pages
          clean: true
