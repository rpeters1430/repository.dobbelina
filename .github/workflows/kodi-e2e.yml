name: Kodi E2E

# Runs Cumination inside a real, headless Kodi and does what a user does:
# open each site, check the list, thumbnails, Next Page, a category, a search,
# and play a video. See scripts/kodi_e2e/README.md.
#
# - pull requests: self-test against local fake sites (deterministic, no live sites)
# - nightly / manual: crawl the live sites, sharded, with FlareSolverr

on:
  pull_request:
    paths:
      - "plugin.video.cumination/**"
      - "script.module.resolveurl/**"
      - "script.module.resolveurl.xxx/**"
      - "scripts/kodi_e2e/**"
      - "scripts/kodi_jsonrpc.py"
      - "config/site_profiles.json"
      - "tests/test_kodi_e2e.py"
      - ".github/workflows/kodi-e2e.yml"
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      sites:
        description: "Comma-separated sites (empty = all)"
        required: false
        default: ""
      deep:
        description: "Also play from a category and from search results"
        type: boolean
        default: false
      shards:
        description: "Parallel jobs"
        type: choice
        options: ["1", "2", "4", "6", "8"]
        default: "6"
      kodi:
        description: "Kodi build"
        type: choice
        options: ["distro", "ppa"]
        default: "distro"

permissions:
  contents: read

concurrency:
  group: kodi-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
      - name: Install Kodi
        run: bash scripts/kodi_e2e/install_kodi.sh distro
      - name: Install Python deps
        run: pip install Pillow pytest
      - name: Harness unit tests
        run: python -m pytest -q tests/test_kodi_e2e.py
      - name: Self-test in real Kodi
        run: python -m scripts.kodi_e2e selftest --out results/kodi_e2e_selftest
      - name: Kodi log on failure
        if: failure()
        run: tail -n 300 .cache/kodi_e2e/selftest-profile/.kodi/temp/kodi.log || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: kodi-e2e-selftest
          path: |
            results/kodi_e2e_selftest/
            .cache/kodi_e2e/selftest-profile/.kodi/temp/kodi.log
          if-no-files-found: warn
          retention-days: 7

  plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - id: p
        env:
          SHARDS: ${{ inputs.shards || '6' }}
        run: |
          python3 -c "import json,os; n=int(os.environ['SHARDS']); print('shards='+json.dumps(list(range(n))))" >> "$GITHUB_OUTPUT"

  crawl:
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    services:
      flaresolverr:
        image: ghcr.io/germondai/trawl@sha256:c46f74dfde3df278ff3dc5357f78df1109dfddd9aef754b4dcba1ac98f6fc6ae
        ports:
          - 8191:8191
    env:
      SITES: ${{ inputs.sites }}
      DEEP: ${{ inputs.deep && '--deep' || '' }}
      KODI_CHANNEL: ${{ inputs.kodi || 'distro' }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ inputs.shards || '6' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
      - name: Install Kodi
        run: bash scripts/kodi_e2e/install_kodi.sh "$KODI_CHANNEL"
      - name: Install Python deps
        run: pip install Pillow
      - name: Wait for FlareSolverr API
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 5 http://localhost:8191/health >/dev/null; then
              response=$(curl -fsS --max-time 8 -H "Content-Type: application/json" \
                --data '{"cmd":"sessions.list"}' http://localhost:8191/v1 2>/dev/null || true)
              if printf '%s' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if isinstance(d,dict) and d.get("status") in (None,"ok") and isinstance(d.get("sessions"),list) else 1)' >/dev/null 2>&1; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::warning::FlareSolverr API not ready; Cloudflare sites may fail"
      - name: Crawl shard
        run: |
          args=(crawl --shard "${SHARD}/${SHARDS}" --out results/kodi_e2e --no-report
                --flaresolverr http://127.0.0.1:8191/v1 --source zip)
          if [ -n "$SITES" ]; then args+=(--site "$SITES"); fi
          if [ -n "$DEEP" ]; then args+=("$DEEP"); fi
          python -m scripts.kodi_e2e "${args[@]}"
      - name: Collect Kodi log
        if: always()
        run: cp .cache/kodi_e2e/profile/.kodi/temp/kodi*.log results/kodi_e2e/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: kodi-e2e-shard-${{ matrix.shard }}
          path: results/kodi_e2e/
          if-no-files-found: warn
          retention-days: 5

  report:
    needs: crawl
    if: always() && needs.crawl.result != 'skipped'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: kodi-e2e-shard-*
          path: shards
      - name: Merge shards
        run: |
          mkdir -p results/kodi_e2e/sites
          cp shards/*/sites/*.json results/kodi_e2e/sites/ 2>/dev/null || true
          first=$(find shards -name 'run*.json' -print -quit 2>/dev/null || true)
          if [ -n "$first" ]; then cp "$first" results/kodi_e2e/run.json; fi
      - name: Restore previous summary
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: baseline
          key: kodi-e2e-baseline-${{ github.run_id }}
          restore-keys: kodi-e2e-baseline-
      - name: Build report
        run: |
          base=()
          if [ -f baseline/summary.json ]; then base=(--baseline baseline/summary.json); fi
          python -m scripts.kodi_e2e report results/kodi_e2e "${base[@]}"
          cat results/kodi_e2e/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep this summary as the next baseline (full runs only)
        if: inputs.sites == ''
        run: mkdir -p baseline && cp results/kodi_e2e/summary.json baseline/summary.json
      - name: Save baseline
        if: inputs.sites == ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: baseline
          key: kodi-e2e-baseline-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kodi-e2e-report
          path: |
            results/kodi_e2e/report.html
            results/kodi_e2e/report.md
            results/kodi_e2e/summary.json
            results/kodi_e2e/sites/
          retention-days: 30
