name: Site Health

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: site-health
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      strict_matrix: ${{ steps.set-strict-matrix.outputs.strict_matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: set-matrix
        run: |
          echo "matrix=$(python scripts/generate_smoke_matrix.py)" >> "${GITHUB_OUTPUT}"
      - id: set-strict-matrix
        run: |
          echo "strict_matrix=$(python scripts/generate_smoke_matrix.py --strict)" >> "${GITHUB_OUTPUT}"

  smoke:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      FLARESOLVERR_URL: http://localhost:8191/v1
    services:
      flaresolverr:
        image: ghcr.io/germondai/trawl@sha256:fc39225a890a40b64ac65731dddd66e52f83fc9c20b54b7ed87c6cecdf355b13
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Wait for FlareSolverr (Trawl)
        run: |
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8191/health 2>/dev/null || echo 000)
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Run live smoke chunk
        run: |
          set +e
          python scripts/live_smoke_test.py --site ${{ matrix.sites }} --out results/${{ matrix.chunk }} --require-flaresolverr
          if [ $? -eq 2 ]; then exit 2; fi
      - name: Upload chunk results
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: smoke-results-${{ matrix.chunk }}
          path: results/

  strict:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.strict_matrix) }}
    env:
      FLARESOLVERR_URL: http://localhost:8191/v1
    services:
      flaresolverr:
        image: ghcr.io/germondai/trawl@sha256:fc39225a890a40b64ac65731dddd66e52f83fc9c20b54b7ed87c6cecdf355b13
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Wait for FlareSolverr (Trawl)
        run: |
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8191/health 2>/dev/null || echo 000)
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Run strict site monitor
        run: |
          set +e
          python scripts/strict_site_monitor.py --site ${{ matrix.site }} --out results/strict
          if [ $? -eq 2 ]; then exit 2; fi
      - name: Upload strict site results
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: strict-results-${{ matrix.site }}
          path: results/strict/strict_site_${{ matrix.site }}.*

  report:
    needs: [smoke, strict]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Download all smoke results
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: all-results
          pattern: smoke-results-*
          merge-multiple: true
      - name: Download all strict results
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: strict-results
          pattern: strict-results-*
          merge-multiple: true
      - name: Merge broad smoke reports
        run: |
          python scripts/merge_smoke_reports.py all-results/*/live_smoke_*.json --out results/site_health_latest.json
      - name: Prepare previous baseline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/site-health
          if git ls-remote --exit-code --heads origin site-health >/dev/null 2>&1; then
            git clone --depth 1 --branch site-health "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/site-health
          else
            git -C /tmp/site-health init
            git -C /tmp/site-health checkout --orphan site-health
            git -C /tmp/site-health remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
      - name: Merge strict health history
        run: |
          PREVIOUS_HIST=""
          if [ -f /tmp/site-health/strict_history.json ]; then PREVIOUS_HIST="--history-file /tmp/site-health/strict_history.json"; fi
          python scripts/strict_health_history.py strict-results/strict_site_*.json --out results ${PREVIOUS_HIST}
      - name: Generate strict triage requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --state all --limit 1000 \
            --json number,title,body,state \
            > results/existing_site_monitor_issues.json
          python scripts/generate_strict_triage_requests.py \
            --latest results/strict_health_latest.json \
            --history results/strict_history.json \
            --existing-issues results/existing_site_monitor_issues.json \
            --out results/strict_triage_requests.json
      - name: Ensure labels and execute triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/ensure_labels.py
          python scripts/automate_triage.py --requests results/strict_triage_requests.json
      - name: Build broad site health diff
        run: |
          PREVIOUS_JSON=""
          if [ -f /tmp/site-health/live_smoke_latest.json ]; then PREVIOUS_JSON="/tmp/site-health/live_smoke_latest.json"; fi
          STABILITY_IN=""
          if [ -f /tmp/site-health/stability.json ]; then STABILITY_IN="/tmp/site-health/stability.json"; fi

          python scripts/smoke_report_diff.py \
            --current results/site_health_latest.json \
            ${PREVIOUS_JSON:+--previous "${PREVIOUS_JSON}"} \
            ${STABILITY_IN:+--stability-in "${STABILITY_IN}"} \
            --stability-out results/stability.json \
            --json-out results/site_health_diff_latest.json \
            --md-out results/site_health_diff_latest.md
      - name: Publish job summary
        run: |
          cat results/strict_health_latest.md >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          cat results/site_health_diff_latest.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload site health artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: site-health-final
          path: results/
      - name: Persist latest baseline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp results/strict_health_latest.json /tmp/site-health/strict_health_latest.json
          cp results/strict_health_latest.md /tmp/site-health/strict_health_latest.md
          cp results/strict_history.json /tmp/site-health/strict_history.json
          cp results/site_health_latest.json /tmp/site-health/live_smoke_latest.json
          cp results/site_health_latest.md /tmp/site-health/live_smoke_latest.md
          cp results/site_health_diff_latest.json /tmp/site-health/site_health_diff_latest.json
          cp results/site_health_diff_latest.md /tmp/site-health/site_health_diff_latest.md

          git -C /tmp/site-health config user.name "github-actions[bot]"
          git -C /tmp/site-health config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/site-health add .
          if git -C /tmp/site-health diff --cached --quiet; then exit 0; fi
          git -C /tmp/site-health commit -m "chore: update site health baseline"
          git -C /tmp/site-health push origin site-health
