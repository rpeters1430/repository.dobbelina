name: Workflow Audit
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/jactionlint.yaml'
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - '.github/jactionlint.yaml'

permissions:
  contents: read

jobs:
  jactionlint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27'
      - run: |
          go install github.com/jdx/jactionlint/v2/cmd/jactionlint@v2.1.0
          "$(go env GOPATH)/bin/jactionlint" --color

  zizmor:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
