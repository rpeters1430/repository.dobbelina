name: Workflow Audit
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/jactionlint.yaml'
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - '.github/jactionlint.yaml'

permissions:
  contents: read

jobs:
  jactionlint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
      - run: |
          go install github.com/jdx/jactionlint/v2/cmd/jactionlint@v2.1.0
          "$(go env GOPATH)/bin/jactionlint" --color

  zizmor:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
