name: Workflow Audit
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/jactionlint.yaml'
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - '.github/jactionlint.yaml'

permissions:
  contents: read

jobs:
  jactionlint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
      - run: |
          go install github.com/jdx/jactionlint/v2/cmd/jactionlint@v2.1.0
          "$(go env GOPATH)/bin/jactionlint" --color

  zizmor:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: zizmorcore/zizmor-action@f9597c869b2e67095f9b527070297a13a6efe928 # v0.7.0
